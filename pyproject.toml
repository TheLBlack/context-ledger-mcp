[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "context-ledger-mcp"
version = "0.1.0"
description = "Local, explicitly scoped architectural memory for coding agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "TheLBlack" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
context-ledger = "context_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_ledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
